name: make-bot-pr
on: workflow_dispatch
permissions:
  contents: write
  pull-requests: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create bot branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c bot-review-test
          printf 'alpha\nbeta\ngamma\n' > bot.txt
          git add bot.txt
          git commit -m "add bot review fixture"
          git push origin bot-review-test
          gh pr create --base main --head bot-review-test --title "Bot PR for intentflow review" --body "Temporary PR authored by github-actions[bot]."
