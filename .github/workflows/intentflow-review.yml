name: intentflow review page

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: intentflow-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the aggregate PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" > pr.diff

      - name: Install the demo intentflow binary
        run: |
          curl -fsSL \
            "https://github.com/wlingze/intentflow-review-e2e/releases/download/intentflow-demo-20261124/intentflow-linux-amd64" \
            -o intentflow
          chmod +x intentflow
          ./intentflow version

      - name: Export the static workbench
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          ./intentflow export --diff pr.diff --out site             --title "$PR_TITLE"             --repo "github.com/${{ github.repository }}"             --branch "pull/${{ github.event.pull_request.number }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # upload-pages-artifact can return before the artifact is indexed.
      # A short delay avoids "No artifacts named github-pages" on deploy.
      - name: Wait for the Pages artifact
        run: sleep 8

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment the review link
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "intentflow review: ${REVIEW_URL}"
